[project]
name = "piighost-docs-mcp"
version = "0.1.0"
description = "An MCP server over the built piighost documentation: search, read a page, look up an identifier."
requires-python = ">=3.13,<3.14"
dependencies = ["mcp>=1.30,<2"]

[project.scripts]
piighost-docs-mcp = "piighost_docs_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# The server runs on 3.13, where an annotation is evaluated when its class is
# built: a forward reference keeps its quotes.
target-version = "py313"
