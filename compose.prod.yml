# Production stack for Coolify: the site and its two MCP servers, built from
# one Dockerfile. Coolify treats this file as the source of truth.
#
# Only web gets a domain. The MCP servers stay on the project network, and the
# public reaches them through nginx, at /mcp and /mcp/code, rate limited.
#
# Build variables, set in Coolify:
#   PIIGHOST_REF     the piighost branch or commit the pages are read from
#   PUBLIC_CHAT_URL  the chatbot's server, empty for no chatbot

x-build: &build
  context: .
  dockerfile: Dockerfile
  args:
    PIIGHOST_REF: ${PIIGHOST_REF:-master}
    PUBLIC_CHAT_URL: ${PUBLIC_CHAT_URL:-}
    PUBLIC_OPENPANEL_CLIENT_ID: ${PUBLIC_OPENPANEL_CLIENT_ID:-41a2d535-a35a-4c3e-82ed-71697bde0fa9}

services:
  web:
    build:
      <<: *build
      target: web
    environment:
      # Magic variable, intentionally valueless: Coolify fills it in and routes
      # the domain to port 8080 (nginx runs unprivileged). A mapping, not a list:
      # Coolify adds its own variables as a mapping and cannot merge the two.
      SERVICE_FQDN_WEB_8080: ""
    restart: unless-stopped

  docs-mcp:
    build:
      <<: *build
      target: docs-mcp
    environment:
      PIIGHOST_BASE_URL: ${DOCS_BASE_URL:-https://docs.piighost.dev}
    restart: unless-stopped

  graph-mcp:
    build:
      <<: *build
      target: graph-mcp
    restart: unless-stopped
