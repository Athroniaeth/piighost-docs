name: CI

# What ships: the frontend that builds the site, and the docs MCP server. The
# content itself is checked by the Deploy workflow, against piighost.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: The MCP server
        run: |
          uvx ruff format --check mcp
          uvx ruff check mcp
          uv run --directory mcp --frozen python -c "import piighost_docs_mcp.server"

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm -C frontend install --frozen-lockfile

      - name: The frontend
        run: |
          pnpm -C frontend run lint
          pnpm -C frontend run check
