# The production stack on a laptop, from a local piighost commit:
#
#   git -C ../piighost archive HEAD | tar -x -C /tmp/piighost-content
#   docker compose up --build
#
# The site is on http://localhost:8080, its MCP servers under /mcp.

x-build: &build
  context: .
  dockerfile: Dockerfile
  additional_contexts:
    piighost: ${PIIGHOST_EXPORT:-/tmp/piighost-content}
  args:
    CONTENT: piighost
    PUBLIC_CHAT_URL: ${PUBLIC_CHAT_URL:-}
    PUBLIC_OPENPANEL_CLIENT_ID: ${PUBLIC_OPENPANEL_CLIENT_ID:-41a2d535-a35a-4c3e-82ed-71697bde0fa9}

services:
  web:
    build:
      <<: *build
      target: web
    ports:
      - "${WEB_PORT:-8080}:8080"

  docs-mcp:
    build:
      <<: *build
      target: docs-mcp
    environment:
      - PIIGHOST_BASE_URL=http://localhost:8080

  graph-mcp:
    build:
      <<: *build
      target: graph-mcp
