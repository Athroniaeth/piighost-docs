# The documentation site: prerendered files, served as they are, and the two
# public MCP servers proxied under /mcp. Traefik terminates TLS in front.

# Each MCP call can cost a search over the whole site: a client gets ten per
# second, enough for the chatbot answering several readers at once, and too few
# to make the site slow for readers.
limit_req_zone $binary_remote_addr zone=mcp:10m rate=10r/s;

server {
    # 8080 rather than 80: the base image runs unprivileged.
    listen 8080;
    server_name _;

    # Recover the real client address from the proxy in front, so the access log
    # and the MCP rate limit see the visitor, not Traefik. Trust is limited to
    # private ranges: X-Forwarded-For is client-controlled.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/markdown application/javascript application/json application/xml image/svg+xml;

    # An unknown path gets the not-found page, with its 404 status: the French
    # one here, the English one under /en/ below.
    error_page 404 /fr/404/index.html;

    # SvelteKit hashes the name of every immutable asset: its content never changes.
    location /_app/immutable/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Each page's Markdown export and the llms.txt files, shown as text in the
    # browser rather than downloaded.
    location ~ \.(md|txt)$ {
        include /etc/nginx/security-headers.conf;
        types { }
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The MCP servers resolve through Docker's DNS at request time, so nginx
    # starts even when one of them is down, and answers 502 for it alone.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # The docs' audience measure, relayed to the self-hosted OpenPanel from the
    # same origin: the policy stays connect-src 'self', and a blocker that
    # filters analytics hosts has nothing to filter. A measure never makes a
    # page wait.
    location /api/op/ {
        set $openpanel https://opapi.athroniaeth.cloud;
        rewrite ^/api/op/(.*)$ /$1 break;
        proxy_pass $openpanel;
        proxy_ssl_server_name on;
        proxy_set_header Host opapi.athroniaeth.cloud;
        # OpenPanel checks the origin against the client's allow list, and a
        # browser does not always send one for a same-origin request.
        proxy_set_header Origin https://docs.piighost.dev;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        access_log off;
    }

    location = /mcp {
        limit_req zone=mcp burst=50 nodelay;
        set $docs_mcp http://docs-mcp:8000;
        proxy_pass $docs_mcp/mcp;
        include /etc/nginx/mcp-proxy.conf;
    }

    location = /mcp/code {
        limit_req zone=mcp burst=50 nodelay;
        set $graph_mcp http://graph-mcp:8080;
        proxy_pass $graph_mcp/mcp;
        include /etc/nginx/mcp-proxy.conf;
    }

    # Every page is prerendered: serve its file, or the 404 page. no-cache on the
    # HTML, else a browser keeps the old asset names and misses a deployment.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }

    location /en/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        error_page 404 /en/404/index.html;
        try_files $uri $uri/index.html =404;
    }
}
