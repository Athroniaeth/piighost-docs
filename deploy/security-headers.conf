# Included per location rather than set once on the server block: nginx does not
# inherit add_header into a block that declares any add_header of its own.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Two policies apply, and a browser enforces both. Each page carries its own as
# a meta tag, written by SvelteKit: script-src 'self' plus the hash of the page's
# inline bootstrap. This one allows 'unsafe-inline' for scripts, which the
# meta tag's hashes then narrow to exactly those scripts, and sets what a meta
# tag cannot, frame-ancestors among them.
#
# Everything is self-hosted, the fonts included. The one other origin is the
# chatbot's: its widget script, its stylesheet and images, and its websocket.
# The widget injects its styles into its own shadow root, hence 'unsafe-inline'
# for style-src. Pagefind compiles its WebAssembly, hence 'wasm-unsafe-eval'.
# __CHAT__ and __CHAT_ORIGIN__ are filled in when the image is built.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' __CHAT_ORIGIN__; style-src 'self' 'unsafe-inline' __CHAT_ORIGIN__; img-src 'self' data: __CHAT_ORIGIN__; font-src 'self' __CHAT_ORIGIN__; connect-src 'self' __CHAT__" always;
